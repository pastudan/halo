<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>The Silent Cartographer — browser POC</title>
  <style>
    html, body { margin: 0; height: 100%; overflow: hidden; background: #000; }
    #app { width: 100%; height: 100%; }
    #overlay {
      position: fixed; inset: 0; display: flex; align-items: center; justify-content: center;
      background: rgba(0, 10, 20, 0.75); color: #cfe8ff; cursor: pointer;
      font-family: -apple-system, system-ui, sans-serif; text-align: center; z-index: 10;
    }
    #overlay h1 { font-weight: 300; letter-spacing: 0.2em; }
    #overlay .small { opacity: 0.7; font-size: 13px; line-height: 1.7; }
    #hud {
      position: fixed; left: 12px; bottom: 10px; color: #9fd0ff; z-index: 5;
      font: 12px/1.5 ui-monospace, monospace; text-shadow: 0 1px 2px #000; pointer-events: none;
      white-space: pre;
    }
    #loading { position: fixed; top: 12px; right: 14px; color: #9fd0ff; z-index: 5;
      font: 12px ui-monospace, monospace; text-shadow: 0 1px 2px #000; }
  </style>
</head>
<body>
  <div id="app"></div>
  <div id="overlay">
    <div>
      <h1>THE SILENT CARTOGRAPHER</h1>
      <p class="small">
        original Halo: Combat Evolved level geometry, in your browser<br/><br/>
        click to enter &mdash; <b>WASD</b> move &middot; <b>mouse</b> look &middot; <b>space</b> jump<br/>
        <b>F</b> toggle fly/walk &middot; <b>Q</b> flashlight &middot; <b>shift</b> sprint &middot; gamepad supported<br/>
        <b>1</b> island &middot; <b>2</b> map room interior
      </p>
    </div>
  </div>
  <div id="loading">loading…</div>
  <div id="hud"></div>
  <script type="module" src="/src/main.js"></script>
</body>
</html>
